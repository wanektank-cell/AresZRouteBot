<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Контакты — ARES SHOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0f;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 18px 50px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 25px;
        }

        .box {
            background: #15151c;
            border: 1px solid #292932;
            border-radius: 15px;
            padding: 25px;
            line-height: 1.8;
        }

        .item {
            margin-bottom: 20px;
        }

        .title {
            color: #999999;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .value {
            color: #ffffff;
            font-size: 17px;
        }

        a {
            color: #aaaaaa;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 ARES SHOP</h1>

    <div class="box">

        <div class="item">
            <div class="title">Продавец</div>
            <div class="value">[ФИО]</div>
        </div>

        <div class="item">
            <div class="title">ИНН</div>
            <div class="value">[ИНН]</div>
        </div>

        <div class="item">
            <div class="title">Email</div>
            <div class="value">[EMAIL]</div>
        </div>

        <div class="item">
            <div class="title">Телефон</div>
            <div class="value">[ТЕЛЕФОН]</div>
        </div>

        <div class="item">
            <div class="title">Поддержка</div>
            <div class="value">
                <a href="https://t.me/Darkwolfan">
                    @Darkwolfan
                </a>
            </div>
        </div>

        <div class="item">
            <div class="title">Магазин</div>
            <div class="value">
                Цифровые товары для Z Route: Redemption
            </div>
        </div>

    </div>

    <a class="back" href="/">
        ← Вернуться в магазин
    </a>

</div>

</body>
</html>
